# Render's free plan sleeps a service after 15 idle minutes and the next visit takes 1-2 minutes.
# Ping the demo apps during Indian working hours (09:30-19:30 IST) so recruiters get a fast first load.
# Limited to ~10 h/day: two always-on services would exceed Render's 750 free instance-hours a month.
name: Keep demos awake

on:
  schedule:
    - cron: '*/5 4-13 * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping ShopNest API and Job Portal
        run: |
          for url in \
            https://shopnest-api-eos1.onrender.com/actuator/health \
            https://shibani-job-portal.onrender.com/; do
            curl -s -o /dev/null -m 120 -w "%{http_code} %{time_total}s $url\n" "$url" || echo "failed $url"
          done
