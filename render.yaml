# Render blueprint for the backend API (Dashboard -> New -> Blueprint -> pick this repo).
# DB_URL: paste your PostgreSQL connection string exactly as Neon/Render/Supabase shows it.
# CORS is not needed in production: Vercel forwards /api to this service server-side.
services:
  - type: web
    name: shopnest-api
    runtime: docker
    rootDir: backend
    plan: free
    healthCheckPath: /actuator/health
    envVars:
      - key: DB_URL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: JWT_SECRET
        generateValue: true
